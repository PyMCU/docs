name = "pymcu-docs-hub"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Static landing page. Assets are served first; the worker (src/index.js) runs for any
# path without a matching file — i.e. the project sub-paths it reverse-proxies.
[assets]
directory = "./site"
binding = "ASSETS"

# Target URL of each published project's docs (Cloudflare Pages projects). Point these
# at the live *.pages.dev URLs. If a Pages project uses a different name, update the URL
# here (the hub redeploys and the sub-path proxy picks it up).
[vars]
PYMCU_DOCS_URL = "https://pymcu-docs.pages.dev"
RP2040SHARP_DOCS_URL = "https://rp2040sharp-docs.pages.dev"
AVR8SHARP_DOCS_URL = "https://avr8sharp-docs.pages.dev"

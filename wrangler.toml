name = "pymcu-docs-hub"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Static landing page. Assets are served first; the worker (src/index.js) runs for any
# path without a matching file — i.e. the project sub-paths it reverse-proxies.
[assets]
directory = "./site"
binding = "ASSETS"

# Target URL of each project's docs deployment. The projects are Cloudflare Pages
# projects (Sphinx needs a Python build), so these are their *.pages.dev URLs.
# Until they go live, the hub still deploys and serves the landing; the sub-paths
# resolve once these point at live deployments. Override per-environment if needed.
[vars]
PYMCU_DOCS_URL = "https://pymcu-docs.pages.dev"
RP2040SHARP_DOCS_URL = "https://rp2040sharp-docs.pages.dev"
